<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Guestbook Traces</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="bg-[#0a0a0a] text-[#E5C06A] min-h-screen p-8">
    <div class="max-w-4xl mx-auto">
        <header class="mb-12 border-b-2 border-current pb-6 flex justify-between items-end">
            <div>
                <h1 class="text-4xl md:text-6xl font-black uppercase tracking-tighter mb-2">Secret Traces</h1>
                <p class="opacity-70 text-lg">Classified Viewing Area</p>
            </div>
            <a href="/"
                class="px-6 py-2 border border-current rounded-full uppercase tracking-widest text-sm font-bold hover:bg-[#E5C06A] hover:text-black transition">
                Back to Site
            </a>
        </header>

        <div class="space-y-4">
            <!-- Loop through messages -->
            <div th:each="msg, iterStatus : ${messages}"
                class="p-6 border border-current rounded-xl bg-transparent hover:bg-white/5 transition-colors relative overflow-hidden group">

                <div class="flex items-start gap-4">
                    <div class="font-mono text-xl opacity-40 font-bold mt-1"
                        th:text="${'#' + (messages.size() - iterStatus.index)}"></div>
                    <div class="text-xl md:text-2xl font-medium leading-relaxed" th:text="${msg}"></div>
                </div>

                <div class="absolute top-0 right-0 p-4 opacity-0 group-hover:opacity-100 transition-opacity">
                    <span class="text-xs tracking-widest uppercase opacity-50">Saved Trace</span>
                </div>
            </div>

            <!-- Empty State -->
            <div th:if="${messages == null or #lists.isEmpty(messages)}"
                class="text-center py-20 border-2 border-dashed border-current rounded-xl opacity-50">
                <p class="text-2xl font-bold uppercase tracking-widest">No traces found yet.</p>
                <p class="mt-2">It's quiet... too quiet.</p>
            </div>
        </div>
    </div>
</body>

</html>
