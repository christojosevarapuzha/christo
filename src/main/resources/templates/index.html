<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Christo Jose</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0a0a0a; color: white; scroll-behavior: smooth; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .gradient-text { background: linear-gradient(to right, #fff, #666); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .bento-item { transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); position: relative; overflow: hidden; }
        .bento-item:hover { transform: translateY(-5px); border-color: #3b82f6; background: rgba(255, 255, 255, 0.05); }
    </style>
</head>
<body class="p-6 md:p-12">

<nav class="max-w-6xl mx-auto flex justify-between items-center mb-12">
    <div class="font-extrabold text-2xl tracking-tighter uppercase">CHRISTO <span class="text-blue-500">JOSE.</span></div>
    <div class="flex gap-8 text-xs font-bold uppercase tracking-widest opacity-60">
        <a href="#work" class="hover:opacity-100 transition">Experience</a>
        <a href="#contact" class="hover:opacity-100 transition text-blue-500">Let's Talk</a>
    </div>
</nav>

<main class="max-w-6xl mx-auto grid grid-cols-1 md:grid-cols-4 gap-4 auto-rows-[180px]">

    <div class="md:col-span-3 md:row-span-2 glass rounded-[2rem] p-10 flex flex-col justify-end relative bento-item">
        <div class="absolute top-[-10%] right-[-10%] w-64 h-64 bg-blue-600 rounded-full blur-[120px] opacity-20"></div>
        <div class="absolute top-6 left-10 text-[80px] font-black opacity-[0.03] select-none uppercase">Christo</div>

        <h1 class="text-5xl md:text-7xl font-extrabold tracking-tighter mb-4 leading-none">
            BUILDING <br> <span class="gradient-text">DIGITAL MAGIC.</span>
        </h1>
        <p class="text-lg opacity-50 max-w-md font-medium">Lead Solution Engineer At IBS Software</p>
    </div>

    <div class="md:col-span-1 md:row-span-2 glass rounded-[2rem] bento-item relative">
        <img src="/images/my-profile.jpg"
             alt="Jose Christo"
             class="absolute inset-0 w-full h-full object-cover grayscale hover:grayscale-0 transition-all duration-700">
    </div>

    <a href="https://www.linkedin.com/in/josechristoprofile/" target="_blank"
       class="md:col-span-1 md:row-span-1 glass rounded-[2rem] p-8 flex flex-col justify-between bento-item group cursor-pointer border-blue-500/30">
        <span class="text-xs uppercase opacity-40 font-bold tracking-widest">LinkedIn</span>
        <div class="text-xl font-bold flex items-center justify-between">
            Connect <span class="transform group-hover:translate-x-1 group-hover:-translate-y-1 transition text-blue-500">↗</span>
        </div>
    </a>

    <div class="md:col-span-2 md:row-span-1 glass rounded-[2rem] p-8 flex items-center justify-around bento-item">
        <div class="text-center">
            <div class="text-5xl font-black italic">7+</div>
            <div class="text-[10px] uppercase opacity-40 font-bold tracking-[0.2em] mt-1">Years Experience</div>
        </div>
        <div class="w-[1px] h-12 bg-white/10"></div>
        <div class="text-center">
            <div class="text-5xl font-black italic text-blue-500">3+</div>
            <div class="text-[10px] uppercase opacity-40 font-bold tracking-[0.2em] mt-1">Global Projects</div>
        </div>
    </div>

    <a href="#contact" class="md:col-span-1 md:row-span-1 bg-white text-black rounded-[2rem] p-8 flex flex-col justify-between hover:bg-blue-600 hover:text-white transition duration-500 group bento-item">
        <span class="text-xs uppercase font-bold tracking-widest">Status: Available</span>
        <div class="text-xl font-bold italic">Hire Me —</div>
    </a>

    <div id="work" class="md:col-span-4 grid grid-cols-2 md:grid-cols-5 gap-4">
        <div class="glass rounded-[2rem] h-32 flex items-center justify-center p-8 bento-item">
            <img src="/images/wipro.png" alt="Wipro" class="max-w-full max-h-full object-contain opacity-40 hover:opacity-100 transition-opacity">
        </div>
        <div class="glass rounded-[2rem] h-32 flex items-center justify-center p-8 bento-item">
            <img src="/images/qatarairways.jpeg" alt="Qatar Airways" class="max-w-full max-h-full object-contain opacity-40 hover:opacity-100 transition-opacity">
        </div>
        <div class="glass rounded-[2rem] h-32 flex items-center justify-center p-8 bento-item">
            <img src="/images/roche.png" alt="Roche" class="max-w-full max-h-full object-contain opacity-40 hover:opacity-100 transition-opacity">
        </div>
        <div class="glass rounded-[2rem] h-32 flex items-center justify-center p-8 bento-item">
            <img src="/images/ibs.png" alt="IBS Software" class="max-w-full max-h-full object-contain opacity-40 hover:opacity-100 transition-opacity">
        </div>
        <div class="glass rounded-[2rem] h-32 flex items-center justify-center p-8 bento-item">
            <img src="/images/expedia.jpeg" alt="Expedia" class="max-w-full max-h-full object-contain opacity-40 hover:opacity-100 transition-opacity">
        </div>
    </div>
</main>

<section id="contact" class="max-w-6xl mx-auto mt-24 px-10 py-24 glass rounded-[3rem] text-center relative overflow-hidden">
    <div class="absolute inset-0 bg-blue-600/5 blur-3xl rounded-full"></div>
    <h2 class="text-5xl md:text-8xl font-black tracking-tighter mb-6 leading-none uppercase">
        Wanna <span class="text-blue-500 italic">Conect?</span>
    </h2>


    <div class="flex flex-col md:flex-row gap-4 justify-center items-center">
        <a href="mailto:christojose24@gmail.com" class="w-full md:w-auto px-12 py-5 bg-white text-black font-bold rounded-full hover:bg-blue-600 hover:text-white transition-all transform hover:scale-105 active:scale-95">
            Send an Email
        </a>
        <a href="https://www.linkedin.com/in/josechristoprofile/" target="_blank" class="w-full md:w-auto px-12 py-5 glass border-white/20 font-bold rounded-full hover:border-blue-500 transition-all transform hover:scale-105 active:scale-95">
            LinkedIn Message
        </a>
    </div>
</section>

<footer class="max-w-6xl mx-auto mt-16 pb-12 opacity-20 text-[10px] flex justify-between uppercase tracking-[0.3em]">
    <span>&copy; 2026 JOSE CHRISTO</span>
    <span>Architected with Spring Boot</span>
</footer>

</body>
