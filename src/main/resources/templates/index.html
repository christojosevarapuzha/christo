<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Brand | 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0a0a0a; color: white; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .gradient-text { background: linear-gradient(to right, #fff, #666); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .bento-item { transition: all 0.3s ease; }
        .bento-item:hover { transform: translateY(-5px); border-color: #3b82f6; }
    </style>
</head>
<body class="p-6 md:p-12">

<nav class="max-w-6xl mx-auto flex justify-between items-center mb-16">
    <div class="font-extrabold text-2xl tracking-tighter">AR.</div>
    <div class="flex gap-8 text-sm font-medium opacity-60">
        <a href="#" class="hover:opacity-100 transition">Work</a>
        <a href="#" class="hover:opacity-100 transition">About</a>
        <a href="#" class="hover:opacity-100 transition">Contact</a>
    </div>
</nav>

<main class="max-w-6xl mx-auto grid grid-cols-1 md:grid-cols-4 gap-4 auto-rows-[180px]">

    <div class="md:col-span-3 md:row-span-2 glass rounded-3xl p-10 flex flex-col justify-end relative overflow-hidden bento-item">
        <div class="absolute top-[-10%] right-[-10%] w-64 h-64 bg-blue-600 rounded-full blur-[120px] opacity-20"></div>
        <h1 class="text-5xl md:text-7xl font-extrabold tracking-tighter mb-4 leading-none">
            BUILDING <br> <span class="gradient-text">DIGITAL MAGIC.</span>
        </h1>
        <p class="text-lg opacity-50 max-w-md" th:text="${role}"></p>
    </div>

    <div class="md:col-span-1 md:row-span-2 glass rounded-3xl overflow-hidden bento-item">
        <img src="/images/my-profile.jpg"
             class="w-full h-full object-cover grayscale hover:grayscale-0 transition duration-500" alt="Avatar">
    </div>

    <div class="md:col-span-1 md:row-span-1 glass rounded-3xl p-6 flex flex-col justify-between bento-item cursor-pointer">
        <span class="text-xs uppercase opacity-40 font-bold tracking-widest">Connect</span>
        <div class="text-xl font-bold">LinkedIn ↗</div>
    </div>

    <div class="md:col-span-2 md:row-span-1 glass rounded-3xl p-8 flex items-center justify-between bento-item">
        <div>
            <div class="text-4xl font-black">7+</div>
            <div class="text-xs uppercase opacity-40 font-bold tracking-widest">Years Experience</div>
        </div>
        <div class="text-right">
            <div class="text-4xl font-black">40+</div>
            <div class="text-xs uppercase opacity-40 font-bold tracking-widest">Projects Done</div>
        </div>
    </div>

    <div class="md:col-span-1 md:row-span-1 bg-white text-black rounded-3xl p-6 flex flex-col justify-between hover:bg-blue-500 hover:text-white transition cursor-pointer">
        <span class="text-xs uppercase font-bold tracking-widest">Available for hire</span>
        <div class="text-xl font-bold italic">Let's Talk —</div>
    </div>

    <div class="md:col-span-4 grid grid-cols-2 md:grid-cols-5 gap-4">

        <div class="glass rounded-3xl h-32 flex items-center justify-center p-8 bento-item group">
            <img src="/images/wipro.png" alt="Wipro" class="max-w-full max-h-full object-contain opacity-50 group-hover:opacity-100 transition-all">
        </div>

        <div class="glass rounded-3xl h-32 flex items-center justify-center p-8 bento-item group">
            <img src="/images/qatarairways.jpeg" alt="Qatar Airways" class="max-w-full max-h-full object-contain opacity-50 group-hover:opacity-100 transition-all ">
        </div>

        <div class="glass rounded-3xl h-32 flex items-center justify-center p-8 bento-item group">
            <img src="/images/roche.png" alt="Roche" class="max-w-full max-h-full object-contain opacity-50 group-hover:opacity-100 transition-all">
        </div>

        <div class="glass rounded-3xl h-32 flex items-center justify-center p-8 bento-item group">
            <img src="/images/ibs.png" alt="IBS Software" class="max-w-full max-h-full object-contain opacity-50 group-hover:opacity-100 transition-all">
        </div>

        <div class="glass rounded-3xl h-32 flex items-center justify-center p-8 bento-item group">
            <img src="/images/expedia.jpeg" alt="Expedia" class="max-w-full max-h-full object-contain opacity-50 group-hover:opacity-100 transition-all">
        </div>

    </div>
</main>

<footer class="max-w-6xl mx-auto mt-16 pb-12 opacity-30 text-xs flex justify-between uppercase tracking-tighter">
    <span>&copy; 2026 Designed by AR</span>
    <span>Built with Spring Boot & Tailwind</span>
</footer>

</body>
</html>
